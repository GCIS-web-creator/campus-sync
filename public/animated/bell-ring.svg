-ring-gD)"/><path d="M8.2 9.8c.2-2 1.3-3.4 3-3.9" stroke="#fff" stroke-opacity=".8" stroke-width="1.1" stroke-linecap="round"/></g><g class="badge"><circle cx="18.2" cy="5.6" r="3.5" fill="url(#cs-bell-ring-rB)" stroke="#fff" stroke-width=".9"/><circle cx="18.2" cy="5.6" r="1" fill="#fff"/></g></svg>
