name: CampusSync CI

on:
  push:
    branches: [main, cloudflare-workers-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-production placeholders are only for compile-time checks. No real student data is used.
      NEXT_PUBLIC_SUPABASE_URL: https://build-check-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-check-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  cloudflare-build:
    if: github.ref == 'refs/heads/cloudflare-workers-migration' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'cloudflare-workers-migration')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Build-time placeholders only. Cloudflare secrets are not required for a dry-run build.
      NEXT_PUBLIC_SUPABASE_URL: https://build-check-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-check-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cloudflare:build
      - run: npx wrangler deploy --dry-run
