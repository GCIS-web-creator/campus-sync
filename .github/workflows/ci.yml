name: CampusSync CI

on:
  push:
    branches: [main, cloudflare-workers-migration, feature/planet-civilization-phase1-2-20261120]
    paths-ignore:
      - package-lock.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Non-production placeholders are only for compile-time checks. No real student data is used.
      NEXT_PUBLIC_SUPABASE_URL: https://build-check-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-check-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for the migration branch
        if: github.ref == 'refs/heads/cloudflare-workers-migration'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run check:i18n
      - name: Test school exam range subject matching
        run: node --experimental-strip-types --test scripts/test-school-range-matching.mjs
      - name: Test book barcode classification
        run: npm run test:book-isbn
      - name: Test notebook inventory and page tracking
        run: npm run test:notebooks
      - name: Test notebook cover document scanner geometry
        run: npm run test:document-scanner
      - name: Test Eiken vocabulary password session validation
        run: npm run test:eiken-vocab
      - name: Test study timer Push request validation
        run: node --experimental-strip-types --test scripts/test-study-timer-push.mjs
      - name: Test contribution submission and review validation
        run: npm run test:contributions
      - name: Test knowledge question and attempt validation
        run: npm run test:knowledge
      - name: Test chemistry question bank coverage and integrity
        run: npm run test:chemistry-question-bank
      - name: Test planet MP technology tree catalog and prerequisites
        run: npm run test:planet-tree
      # The LINE webhook imports getCloudflareContext directly, so this package is needed
      # even for the ordinary Next.js compile step.
      - name: Install OpenNext runtime and Playwright for browser smoke tests
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @opennextjs/cloudflare@1.20.16 wrangler@4.158.0 playwright
      - run: npm run build
      - name: Build Cloudflare Worker
        if: github.ref == 'refs/heads/cloudflare-workers-migration' || github.ref == 'refs/heads/feature/planet-civilization-phase1-2-20261120' || (github.event_name == 'pull_request' && github.base_ref == 'cloudflare-workers-migration')
        run: npx opennextjs-cloudflare build
      - name: Validate Worker bundle without deploying
        if: github.ref == 'refs/heads/cloudflare-workers-migration' || github.ref == 'refs/heads/feature/planet-civilization-phase1-2-20261120' || (github.event_name == 'pull_request' && github.base_ref == 'cloudflare-workers-migration')
        run: npx wrangler deploy --dry-run
      - name: Install Playwright for browser smoke tests
        if: github.ref == 'refs/heads/cloudflare-workers-migration' || github.ref == 'refs/heads/feature/planet-civilization-phase1-2-20261120' || (github.event_name == 'pull_request' && github.base_ref == 'cloudflare-workers-migration')
        run: |
          npx playwright install --with-deps chromium
      - name: Smoke-test Planet Civilization in a local Worker browser
        if: github.ref == 'refs/heads/cloudflare-workers-migration' || github.ref == 'refs/heads/feature/planet-civilization-phase1-2-20261120' || (github.event_name == 'pull_request' && github.base_ref == 'cloudflare-workers-migration')
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/campus-sync-wrangler.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8787/ >/dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/campus-sync-wrangler.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            cat /tmp/campus-sync-wrangler.log
            exit 1
          fi
          node scripts/e2e/planet-civilization-smoke.mjs
      # PR/test builds keep the safe placeholder config above. Rebuild the production
      # artifact with the real public Supabase URL and publishable key before deployment.
      # The service_role key remains a Cloudflare secret and is never embedded in the bundle.
      - name: Build production Worker with Supabase public config
        if: github.ref == 'refs/heads/cloudflare-workers-migration'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://sgvhktudhxufluuaipwt.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-0qezEAXvQ8_9KgEGGXsZw_ZMUJExE5
        run: |
          npm run build
          npx opennextjs-cloudflare build
          npx wrangler deploy --dry-run
      - name: Deploy Cloudflare Worker to production
        # Production deployment is gated by the explicit [deploy-worker] commit marker.
        if: github.ref == 'refs/heads/cloudflare-workers-migration' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-worker]')))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare production deploy requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npx wrangler deploy
      - name: Upload validated Cloudflare Worker bundle
        if: github.ref == 'refs/heads/cloudflare-workers-migration'
        uses: actions/upload-artifact@v4
        with:
          name: campus-sync-cloudflare-worker-${{ github.sha }}
          path: |
            .open-next/**
            wrangler.jsonc
            package.json
            package-lock.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Save regenerated lockfile to migration branch
        if: github.ref == 'refs/heads/cloudflare-workers-migration' && success()
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update lockfile for Cloudflare-compatible Next.js"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
